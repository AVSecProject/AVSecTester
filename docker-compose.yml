# End-to-end environment: a CARLA 0.9.16 server + the AVSecTester GPU image (defaults to a shell).
#   ./scripts/preparation/fetch_models.sh          # once, on the host: pulls carla-vehicle weights → ./models
#   scripts/preparation/write_compose_env.sh     # once; edit GPU selections in .env
#   docker compose up -d --build       # start CARLA + the idle experiment shell
#   docker compose exec carla-experiment avsectester run configs/carla_phantom.yaml   # the experiment
#   docker compose exec carla-experiment bash                                       # open a shell
#
# Model links are created by the Dockerfile. Containers use the GPU selections from .env.
services:
  carla-server:
    image: carlasim/carla:0.9.16
    command: ./CarlaUE4.sh -RenderOffScreen -nosound -quality-level=Low -carla-rpc-port=2000
    shm_size: 2gb
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=${CARLA_SERVER_GPU:-0}

  carla-experiment:
    build: {context: ., target: carla}
    image: avsectester:carla
    depends_on: [carla-server]
    network_mode: host
    user: "${AVSECTESTER_UID:?Run scripts/preparation/write_compose_env.sh}:${AVSECTESTER_GID:?Run scripts/preparation/write_compose_env.sh}"
    environment:
      - NVIDIA_VISIBLE_DEVICES=${CARLA_EXPERIMENT_GPU:-0}
      - PYTHONPATH=${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}
      - HOME=/tmp
    volumes:
      - "${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}:${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}"
      - ./models:/app/models          # share fetched weights with the host
    working_dir: "${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}"
    stdin_open: true
    tty: true

  nurec-experiment:
    profiles: [nurec]
    image: avsectester:nurec
    build: {context: ., target: nurec}
    network_mode: host
    user: "${AVSECTESTER_UID:?Run scripts/preparation/write_compose_env.sh}:${AVSECTESTER_GID:?Run scripts/preparation/write_compose_env.sh}"
    group_add: ["${DOCKER_GID:?Run scripts/preparation/write_compose_env.sh}"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NUREC_GPU:-0}
      # Host index for services that run starts; CDI runtimes hide NVIDIA_VISIBLE_DEVICES.
      - AVSECTESTER_HOST_GPU=${NUREC_GPU:-0}
      - PYTHONPATH=${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}
      - HOME=/tmp
    volumes:
      - "${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}:${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}"
      - /var/run/docker.sock:/var/run/docker.sock
      - "${DOCKER_CLI:?Run scripts/preparation/write_compose_env.sh}:/usr/bin/docker:ro"
    working_dir: "${AVSECTESTER_ROOT:?Run scripts/preparation/write_compose_env.sh}"
    entrypoint: ["python", "-m", "avsectester.cli"]
