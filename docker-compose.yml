# End-to-end environment: a CARLA 0.9.15 server + the AVSecTester GPU image (defaults to a shell).
#   ./scripts/fetch_models.sh          # once, on the host: pulls carla-vehicle weights → ./models
#   docker compose up -d --build       # start CARLA + the (idle) AVSecTester shell container
#   docker compose exec avsectester python scripts/run_demo.py 40             # run the attack demo
#   docker compose exec avsectester bash                                       # open a shell
#
# The entrypoint symlinks the bind-mounted ./models into the mmdet3d root, then runs the command
# (default: bash, kept alive by tty). The box's default docker runtime is nvidia, so both
# containers get GPUs (CARLA on GPU 0, AVSecTester on 1).
services:
  carla:
    image: carlasim/carla:0.9.15
    command: ./CarlaUE4.sh -RenderOffScreen -nosound -quality-level=Low -carla-rpc-port=2000
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=0

  avsectester:
    build: .
    image: avsectester
    depends_on: [carla]
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - ./models:/app/models          # share fetched weights with the host
    stdin_open: true
    tty: true
    # link the mounted weights into the mmdet3d root, then run the command (Dockerfile CMD = bash)
    entrypoint: ["bash", "-lc", "bash scripts/fetch_models.sh >/dev/null 2>&1 || true; exec \"$@\"", "--"]
