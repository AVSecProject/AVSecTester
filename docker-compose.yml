# End-to-end: neural perception (CARLA-trained mmdet3d) in closed-loop CARLA.
#   ./scripts/fetch_models.sh          # once, on the host: pulls carla-vehicle weights → ./models
#   docker compose up --build
#
# Brings up a CARLA 0.9.15 server and the AVSecTester GPU image, waits for the sim, then runs the
# neural phantom-attack smoke (clean vs attacked). ./models is mounted and symlinked into the
# mmdet3d root at container start, so weights are shared with the host (not baked into the image).
# The box's default docker runtime is nvidia, so both containers get GPUs.
services:
  carla:
    image: carlasim/carla:0.9.15
    command: ./CarlaUE4.sh -RenderOffScreen -nosound -quality-level=Low -carla-rpc-port=2000
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=0

  avsectester:
    build: .
    image: avsectester
    depends_on: [carla]
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
    volumes:
      - ./models:/app/models          # share fetched weights with the host
    command: >
      bash -lc "
        bash scripts/fetch_models.sh >/dev/null 2>&1 || true;
        echo 'waiting for CARLA :2000 ...';
        for i in $$(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/2000) 2>/dev/null && break; sleep 3; done;
        python scripts/smoke_carla_neural.py 40
      "
