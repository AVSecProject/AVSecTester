[project]
name = "avsectester"
dynamic = ["version"]
description = "Closed-loop adversarial stress-testing framework for autonomous-vehicle systems"
authors = [{ name = "zqzqz", email = "fszqz001@gmail.com" }]
readme = "README.md"
license = "MIT"
# Match avstack-core's supported interpreter for the closed-loop path.
requires-python = ">=3.11,<3.12"
keywords = ["autonomous-vehicles", "security", "adversarial", "carla", "avstack"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

# Framework dependencies only. PyArrow is loaded when a persistent run log is opened.
# The heavy AV stack (torch/mmdet/avstack/carla) is installed
# via the `avstack` extra + the submodules under third_party/ — see docs/getting-started/installation.md.
dependencies = [
    "pyyaml>=6,<7",            # scenario config
    "numpy>=1.26,<2",         # numpy 1.26 (torch 2.1 / OpenMMLab-official stack; see dependency-upgrade)
    "typer>=0.15,<0.17",      # CLI (>=0.15 for click 8.2+ compatibility)
    "matplotlib>=3.6",       # evaluation reports always generate plots
    "Pillow>=10",            # image exports from recorded payloads
    "pyarrow==21.0.0",       # Parquet RunLog; same pin in the Python 3.12 driver environment
]

[project.optional-dependencies]
# Shared planar sampling and image composition, without a simulator or driving model.
rendering = [
    "opencv-python-headless>=4.9,<4.12",
    "Pillow>=10",
]
# Static-mesh depth for NuRec; shared by the Python 3.11 and 3.12 interpreters.
nurec = [
    "trimesh==5.1.1",
    "embreex==4.4.0.post1",
]
# Native avstack libraries. Installed as editable path deps from the git submodules.
# NOTE: install order and the heavy torch/mmcv/mmdet wheels are documented in docs/getting-started/installation.md.
avstack = [
    "avstack-core",
    "avstack-api",
    "lib-avstack-carla",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Offline functional tests. Install CPU torch separately (see tests/README.md).
test = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "Pillow>=10",
    "matplotlib>=3.7,<3.8",
    "opencv-python-headless>=4.9,<4.12",
    "albumentations==1.4.24",
]
# Optional augmentation library for avsectester.closed_loop.sensor_corruptions (weather/sensor corruptions).
# Albumentations 1.4 (MIT) supports the NumPy<2 environment used by Torch 2.1 and OpenMMLab.
# AlbumentationsX/2.x require NumPy>=2. Built-in sensor transforms do not require Albumentations.
augment = [
    "albumentations>=1.4,<2",
]

[project.scripts]
avsectester = "avsectester.cli:app"

# uv resolves the avstack packages from the vendored submodules.
[tool.uv.sources]
avstack-core = { path = "third_party/avstack-core", editable = true }
avstack-api = { path = "third_party/avstack-api", editable = true }
lib-avstack-carla = { path = "third_party/lib-avstack-carla", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored upstream code lives under third_party/ (populated git submodules); only lint our package.
extend-exclude = ["third_party", "dev"]
src = ["avsectester", "scripts", "tests"]

[tool.ruff.lint]
# Check syntax, undefined names and unused imports. Formatting is not a CI gate.
select = ["E9", "F"]
# C408: allow the `dict(type=...)` config idiom (avstack/mmengine build-from-config convention).
# B008: typer requires `typer.Argument(...)`/`typer.Option(...)` calls in CLI arg defaults.
ignore = ["C408", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/avstack"]
addopts = "-ra"
markers = [
    "carla: live CARLA, GPU and model checkpoints required; opt in with --run-carla",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "avsectester/__init__.py"

[tool.mypy]
files = [
    "avsectester/attack/attack.py", "avsectester/attack/runtime.py",
    "avsectester/attack/segments.py", "avsectester/attack/insertion/placement.py", "avsectester/cli.py",
    "avsectester/experiment/__init__.py", "avsectester/experiment/config.py",
    "avsectester/experiment/engine.py", "avsectester/experiment/models.py",
    "avsectester/experiment/output_directory.py", "avsectester/experiment/type_registry.py",
    "avsectester/experiment/configuration_summary.py",
    "avsectester/experiment/result_evaluation.py",
    "avsectester/data_types.py", "avsectester/validation.py",
    "avsectester/type_paths.py", "avsectester/serialization.py", "avsectester/closed_loop/hooks.py",
    "avsectester/closed_loop/avstacks/base.py", "avsectester/closed_loop/avstacks/driving_adapter.py",
    "avsectester/closed_loop/simulators/object_composition.py",
    "avsectester/closed_loop/simulators/ego_dynamics.py",
    "avsectester/closed_loop/simulators/base.py", "avsectester/execution/",
    "avsectester/runlog/log.py",
    "avsectester/datasets/base.py", "avsectester/evaluation/",
    "avsectester/closed_loop/environment.py", "avsectester/geometry/",
]
python_version = "3.11"
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
