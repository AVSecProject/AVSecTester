[project]
name = "avsectester"
version = "0.0.1"
description = "Closed-loop adversarial stress-testing framework for autonomous-vehicle systems"
authors = [{ name = "zqzqz", email = "fszqz001@gmail.com" }]
readme = "README.md"
license = "MIT"
# Pinned to avstack's supported interpreter for the closed-loop path (avstack-core requires >=3.10,<3.11).
requires-python = ">=3.11,<3.12"
keywords = ["autonomous-vehicles", "security", "adversarial", "carla", "avstack"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

# Lightweight core deps only. The heavy AV stack (torch/mmdet/avstack/carla) is installed
# via the `avstack` extra + the submodules under third_party/ — see docs/SETUP.md.
dependencies = [
    "pyyaml>=6,<7",            # scenario config
    "numpy>=2,<3",            # numpy 2.x (torch 2.5 / albumentationsx / avstack-core all on numpy 2)
    "typer>=0.15,<0.17",      # CLI (>=0.15 for click 8.2+ compatibility)
]

[project.optional-dependencies]
# The avstack backend stack. Installed as editable path deps from the git submodules.
# NOTE: install order and the heavy torch/mmcv/mmdet wheels are documented in docs/SETUP.md.
avstack = [
    "avstack-core",
    "avstack-api",
    "lib-avstack-carla",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Visualization (avsectester.viz): the clean-vs-attacked driving-impact plot.
viz = [
    "matplotlib>=3.6",
]
# Battle-tested augmentation backend for avsectester.simulators.augment (weather/sensor corruptions).
# AlbumentationsX (2.x, AGPL/commercial) now that the stack is on numpy 2. Same `import albumentations
# as A` API. The hand-rolled operators remain the zero-dependency fallback.
augment = [
    "albumentationsx>=2.0",
]

[project.scripts]
avsectester = "avsectester.cli:app"

# uv resolves the avstack packages from the vendored submodules.
[tool.uv.sources]
avstack-core = { path = "third_party/avstack-core", editable = true }
avstack-api = { path = "third_party/avstack-api", editable = true }
lib-avstack-carla = { path = "third_party/lib-avstack-carla", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored upstream code lives under third_party/ (populated git submodules); only lint our package.
extend-exclude = ["third_party", "dev"]
src = ["avsectester", "tests"]

[tool.ruff.lint]
# C408: allow the `dict(type=...)` config idiom (avstack/mmengine build-from-config convention).
# B008: typer requires `typer.Argument(...)`/`typer.Option(...)` calls in CLI arg defaults.
ignore = ["C408", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "carla: live CARLA, GPU and model checkpoints required; opt in with --run-carla",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avsectester"]
