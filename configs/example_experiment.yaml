# Example AVSecTester security-experiment spec (illustrative — backends land in Phase 2).
# Mirrors PROJECT.md 8.5: "Can a LiDAR spoofing attack cause persistent phantom tracks and
# unsafe braking in CARLA, with and without a temporal-consistency defense?"
name: lidar_spoof_phantom_brake

system:
  name: lidar_pointpillars_stack
  # avstack pipeline config (SerialPipeline of perception -> tracking -> planning -> control).
  pipeline:
    type: SerialPipeline
    modules: []   # TODO(phase2): MMDetObjectDetector3D + tracker + planner + controller
  access_level: whitebox

scenario:
  backend:
    type: CarlaBackend
    town: Town10HD
    fixed_delta_seconds: 0.05
  initial_conditions: {ego_speed_mps: 8.0}
  target_objects:
    - {kind: phantom, range_m: 12.0}
  seeds: [0, 1, 2]
  repetitions: 3

attack:
  spec:
    type: LidarSpoofAttack
    mode: inject
    n_points: 200
    target_xyz: [12.0, 0.0, 0.0]
  threat_model:
    goal: Induce unsafe emergency braking via a phantom obstacle.
    knowledge: blackbox
    access: [sensor, physical_environment]
    target: ego LiDAR perception
    capabilities: [inject_lidar_points]
    constraints: [points_within_sensor_fov, "n_points<=1000"]
    success_criteria: Phantom object tracked for >=3 frames and ego decelerates > 4 m/s^2.

defense:
  spec:
    type: TemporalConsistencyDefense   # TODO(phase5)
    window: 5

evaluation:
  metrics:
    - {type: ActivationMetric}
    - {type: PersistenceMetric}
    - {type: SafetyMetric}         # reuses avstack RSS + CARLA collision/infraction
    - {type: DetectabilityMetric}
    - {type: MitigabilityMetric}
  repetitions: 3
