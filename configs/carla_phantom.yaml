# Run with: avsectester run configs/carla_phantom.yaml
# Paths are relative to this file; set data/model paths for your machine.
dataset:
  type: CarlaDataset
  options:
    recipes:
      town03_lead:
        type: CarlaRecipe
        options:
          time_step: 0.05
          decision_steps: 60
          scenario:
            client:
              map_name: Town03
            ego:
              type: CarlaMobileActor
              spawn: 0
              vehicle: vehicle.tesla.model3
              autopilot: false
              destination: null
              sensors:
              - type: CarlaLidar
                name: lidar-0
                rotation_frequency: 20
                sensor_tick: 0.0
                range: 70.0
            lead:
              gap: 25.0
              vehicle: vehicle.tesla.model3
            npcs: []
          motion:
            ego:
              type: PrescribedMotion
              options:
                constant_control:
                  type: Control
                  options:
                    throttle: 0.35
            lead:
              type: PrescribedMotion
              options:
                constant_control:
                  type: Control
                  options:
                    brake: 1.0
simulator:
  type: CarlaSimulator
  options:
    client:
      connect_ip: 127.0.0.1
      connect_port: 2000
      traffic_manager_port: 8000
      rate: 20.0
      synchronous: true
      seed: 0
avstack:
  type: ModularAVStack
  options:
    pipeline_cfg:
      type: ModularDrivingPipeline
      perception_input: lidar-0-0
      perception:
        type: MMDetObjectDetector3D
        model: pointpillars
        dataset: carla-vehicle
        gpu: 0
        threshold: 0.3
      tracking:
        type: BasicBoxTracker3D
      planning:
        type: ForwardCollisionPlanner
        target_speed: 6.0
        brake_distance: 12.0
        brake_corridor: 2.5
      control:
        type: VehiclePIDController
        args_lateral:
          K_P: 1.2
          K_D: 0.1
          K_I: 0.05
        args_longitudinal:
          K_P: 0.4
          K_D: 0.0
          K_I: 0.05
seeds:
- 0
evaluation:
  metrics:
  - type: DrivingMetrics
  - type: DetectionMetrics
  - type: StopImpact
recording:
  sensor_ids:
  - lidar-0-0
  representations:
  - model_input
  every_n_steps: 1
output: ../results/carla_phantom
attacks:
  phantom:
    type: PhantomInjectionAttack
    options:
      decision_steps: 20
      max_segments: 2
      target_xyz:
      - 6.0
      - 0.0
      - -0.7
      object_type: Car
      score: 0.9
      extent:
      - 4.0
      - 1.8
      - 1.6
treatments:
- name: clean
- name: phantom
  attack_name: phantom
- name: phantom_rain
  attack_name: phantom
  environment:
    world:
      weather: SoftRainNoon
