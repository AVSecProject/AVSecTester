# Paths are relative to this file; set data/model paths for your machine.
device: cuda:0
dataset:
  type: NuRecDataset
  options:
    dataroot: ../data/nurec/26.04_release
    camera_id: camera_front_wide_120fov
    time_step: 0.1
split:
  train_segments: 5
  seed: 0
  execute: [test]
simulator:
  type: NuRecSimulator
  options:
    depth: none
    object_occlusion: rendered_probes
    occlusion_tolerance_m: 0.15
    ground_mesh: mesh_ground
    physics_update_mode: ego_only
    route_generator: map
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50051
        cameras:
        - camera_front_wide_120fov
        resolution_hw:
          camera_front_wide_120fov:
          - 1080
          - 1900
        probe_directory: ../results/nre-probes
        server_probe_directory: /mnt/nre-probes
    dynamics:
      type: avsectester.closed_loop.simulators.ego_dynamics:AlpaSimController
avstack:
  type: RuleBasedAVStack
  bindings:
    type: avsectester.closed_loop.avstacks.implemented.rule_based:rule_based_driving_adapter
  options:
    detector:
      type: avsectester.closed_loop.avstacks.implemented.rule_based:CocoStopSignDetector
      options:
        weights_path: ../models/fasterrcnn_resnet50_fpn_coco-258fb6c6.pth
attacks:
  no_patch:
    type: StopSignPatchAttack
    options:
      initial_patch: none
      harmonizer: &exposure_harmonizer
        type: avsectester.rendering.harmonizers:ExposureHarmonizer
        options: {reference: under}
  white:
    type: StopSignPatchAttack
    options:
      initial_patch: white
      harmonizer: *exposure_harmonizer
  black:
    type: StopSignPatchAttack
    options:
      initial_patch: black
      harmonizer: *exposure_harmonizer
  noise:
    type: StopSignPatchAttack
    options:
      initial_patch: low_frequency_noise
      harmonizer: *exposure_harmonizer
  white_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: white
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 200
              step_size: 0.01568627450980392
              batch: 4
              seed: 0
          samples_per_scene: all
  black_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: black
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 200
              step_size: 0.01568627450980392
              batch: 4
              seed: 0
          samples_per_scene: all
  noise_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: low_frequency_noise
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 200
              step_size: 0.01568627450980392
              batch: 4
              seed: 0
          samples_per_scene: all
evaluation:
  metrics:
  - type: StopLineMetrics
  - type: DrivingMetrics
  - type: avsectester.implemented_attacks.stop_sign_patch_attack.metrics:ReplicaVisibility
runs:
  treatments:
  - name: clean
    attack_name: no_patch
  - name: white
    attack_name: white
  - name: black
    attack_name: black
  - name: noise
    attack_name: noise
  - name: white_detector_pgd
    attack_name: white_detector_pgd
  - name: black_detector_pgd
    attack_name: black_detector_pgd
  - name: noise_detector_pgd
    attack_name: noise_detector_pgd
  seeds:
  - 0
  decision_steps: null
  recording:
    sensor_ids:
    - camera_front_wide_120fov
    representations:
    - model_input
    every_n_steps: 10
  output: ../results/nurec_stop_sign_patch_modular_2604
