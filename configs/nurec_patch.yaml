# Paths are relative to this file; set data/model paths for your machine.
device: cuda:0

dataset:
  type: NuRecDataset
  options:
    usdz_paths:
    - ../data/nurec/023b7fcc-671c-40e3-9bd2-c66b0b073fbc/023b7fcc-671c-40e3-9bd2-c66b0b073fbc.usdz
    camera_id: camera_front_wide_120fov
    time_step: 0.1
simulator:
  type: NuRecSimulator
  options:
    route_generator: map
    physics_update_mode: ego_only
    ground_mesh: mesh
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50051
        cameras:
        - camera_front_wide_120fov
        - camera_front_tele_30fov
        - camera_cross_left_120fov
        - camera_cross_right_120fov
    dynamics:
      type: avsectester.closed_loop.simulators.ego_dynamics:AlpaSimController
avstack:
  type: AlpamayoAVStack
  options:
    checkpoint_path: ../models/Alpamayo-1.5-10B
    camera_ids:
    - camera_front_wide_120fov
    - camera_front_tele_30fov
    - camera_cross_left_120fov
    - camera_cross_right_120fov
    output_frequency_hz: 10
    frame_subsample: 1
attacks:
  patch:
    type: PatchAttack
    options:
      decision_steps: 20
      max_windows: 1
      sensor: camera_front_wide_120fov
      width_m: 1.0
      height_m: 0.5
      max_distance: 30.0
      candidate_hosts:
      - '15'
      hosts_per_window: 1
      assets:
        type: avsectester.rendering.textures:CheckerboardTexture
        options:
          size: 256
          cells: 8
runs:
  treatments:
  - name: clean
  - name: patch
    attack_name: patch
  seeds:
  - 0
  recording:
    sensor_ids:
    - camera_front_wide_120fov
    representations:
    - model_input
    every_n_steps: 1
  output: ../results/nurec_patch
