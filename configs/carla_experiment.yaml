# Closed-loop CARLA experiment (needs a CARLA 0.9.15 server on :2000).
#   avsectester run configs/carla_experiment.yaml
# Same engine as the mock config, driving the real avcarla closed loop.
name: lidar_spoof_phantom_brake_carla

system:
  name: carla_av_baseline
  pipeline: {}
  access_level: blackbox

scenario:
  backend:
    type: CarlaBackend
    connect_ip: 127.0.0.1
    connect_port: 2000
    n_npcs: 0            # keep the ego's path clear so the phantom is the only hazard
    frames: 140
    target_speed: 6.0
  initial_conditions:
    frames: 140

attack:
  spec:
    type: LidarSpoofAttack
    target_xyz: [12.0, 0.0, 0.0]
  threat_model:
    goal: Create a phantom obstacle to induce unsafe braking.
    knowledge: blackbox
    access: [sensor, physical_environment]
    target: ego LiDAR perception
    capabilities: [inject_lidar_points]
    constraints: [n_points<=1000]
    success_criteria: Phantom detected -> ego decelerates hard.

evaluation:
  metrics:
    - type: EscalationMetric
  repetitions: 1
