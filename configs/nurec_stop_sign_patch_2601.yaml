  options:
    usdz_paths:
    - ../data/nurec/df113232-421d-4a88-8b1e-310291b08674/df113232-421d-4a88-8b1e-310291b08674.usdz
    - ../data/nurec/6d95a6b3-ef42-4cc0-941f-dbed4d15901a/6d95a6b3-ef42-4cc0-941f-dbed4d15901a.usdz
    - ../data/nurec/c6a47fa1-6d26-449e-a544-3c5be1051dfd/c6a47fa1-6d26-449e-a544-3c5be1051dfd.usdz
