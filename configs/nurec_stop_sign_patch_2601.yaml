    - ../data/nurec/1316f5fa-9b99-4979-90eb-1a8d56b32a73/1316f5fa-9b99-4979-90eb-1a8d56b32a73.usdz
    - ../data/nurec/d2fcf4b2-2a4b-47e3-a2ec-a9e3372c3a8a/d2fcf4b2-2a4b-47e3-a2ec-a9e3372c3a8a.usdz
