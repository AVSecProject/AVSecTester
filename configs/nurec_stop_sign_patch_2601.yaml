    - ../data/nurec/7eaac028-ff62-4f54-9cca-52c8f49ba87e/7eaac028-ff62-4f54-9cca-52c8f49ba87e.usdz
    - ../data/nurec/aeeaa73d-9274-4610-9669-193ff356a53d/aeeaa73d-9274-4610-9669-193ff356a53d.usdz
