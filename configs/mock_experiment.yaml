# Simulator-free experiment (no CARLA):  avsectester run configs/mock_experiment.yaml
# Clean vs attacked vs attacked+defended, scored by ImpactMetric.
name: mock_object_spoof_defended

environment: {type: MockEnv, frames: 140}
system: {type: MockSystem, target_speed: 6.0}

attack:
  type: ObjectSpoofingAttack
  target_xyz: [6.0, 0.0, 0.0]   # phantom 6 m ahead (in the brake corridor)
  score: 0.3                    # low detector confidence -> the defense can gate it

defense:
  type: ScoreGateDefense
  threshold: 0.5

metric: {type: ImpactMetric}
