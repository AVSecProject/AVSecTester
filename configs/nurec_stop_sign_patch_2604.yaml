# Run with: avsectester run configs/nurec_stop_sign_patch_2604.yaml
# Paths are relative to this file; set data/model paths for your machine.
dataset:
  type: NuRecDataset
  options:
    usdz_paths:
    - ../data/nurec/6d986fb9-6694-4570-910b-d8bf4ffa8550/6d986fb9-6694-4570-910b-d8bf4ffa8550.usdz
    - ../data/nurec/3e9966a3-c42d-4fd1-b588-6f5cc02b7c25/3e9966a3-c42d-4fd1-b588-6f5cc02b7c25.usdz
    - ../data/nurec/f3fd4dbd-5c4e-4774-8b41-ebb9b515e9cb/f3fd4dbd-5c4e-4774-8b41-ebb9b515e9cb.usdz
    - ../data/nurec/85a26192-7b37-43a2-bd5d-96cd858cb86b/85a26192-7b37-43a2-bd5d-96cd858cb86b.usdz
    - ../data/nurec/1e5435de-0e4f-4f9c-943b-c44275544715/1e5435de-0e4f-4f9c-943b-c44275544715.usdz
    - ../data/nurec/7d257301-a9d1-433b-8f08-85023a4d0fac/7d257301-a9d1-433b-8f08-85023a4d0fac.usdz
    - ../data/nurec/f922e4bc-7bf3-4c4d-a254-63fadb4fd2fe/f922e4bc-7bf3-4c4d-a254-63fadb4fd2fe.usdz
    - ../data/nurec/cda8a096-0982-4a91-b721-624dac7c83b8/cda8a096-0982-4a91-b721-624dac7c83b8.usdz
    - ../data/nurec/b40f4729-29c4-4846-a04b-72c78832a062/b40f4729-29c4-4846-a04b-72c78832a062.usdz
    - ../data/nurec/56263647-352f-45b7-95c5-1d077a512b66/56263647-352f-45b7-95c5-1d077a512b66.usdz
    - ../data/nurec/22ab49c5-2c92-463b-b890-0b2208c436b1/22ab49c5-2c92-463b-b890-0b2208c436b1.usdz
    - ../data/nurec/7fd4d554-b155-45c6-a46a-646486029d85/7fd4d554-b155-45c6-a46a-646486029d85.usdz
    - ../data/nurec/3e265bc2-2a8b-4c5c-8e6b-1de009b6672d/3e265bc2-2a8b-4c5c-8e6b-1de009b6672d.usdz
    - ../data/nurec/0bd5202f-5f7c-4748-b78d-20d1f921b4db/0bd5202f-5f7c-4748-b78d-20d1f921b4db.usdz
    - ../data/nurec/904af7cf-d4ad-4ebc-867a-c77044eac8bb/904af7cf-d4ad-4ebc-867a-c77044eac8bb.usdz
    - ../data/nurec/adb72a39-1e21-46ef-80f2-9c86a8e9504a/adb72a39-1e21-46ef-80f2-9c86a8e9504a.usdz
    - ../data/nurec/325a6911-8ee8-4a04-8b84-55dbfcada98f/325a6911-8ee8-4a04-8b84-55dbfcada98f.usdz
    camera_id: camera_front_wide_120fov
    time_step: 0.1
simulator:
  type: NuRecSimulator
  options:
    depth: none
    object_occlusion: rendered_probes
    occlusion_tolerance_m: 0.15
    ground_mesh: mesh_ground
    physics_update_mode: ego_only
    route_generator: map
    config:
      dt: 0.1
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50051
        cameras:
        - camera_front_wide_120fov
        resolution_hw:
          camera_front_wide_120fov:
          - 1080
          - 1900
        probe_directory: ../results/nre-probes
        server_probe_directory: /mnt/nre-probes
    dynamics:
      type: avsectester.closed_loop.simulators.ego_dynamics:AlpaSimController
      options: {}
avstack:
  type: AlpamayoAVStack
  options:
    checkpoint_path: ../models/Alpamayo-1.5-10B
    device: cuda:0
    camera_ids:
    - camera_front_wide_120fov
    frame_subsample: 1
    output_frequency_hz: 10
attacks:
  replica:
    type: StopSignPatchAttack
    options:
      initial_patch: none
      harmonizer: &exposure_harmonizer
        type: avsectester.rendering.harmonizers:ExposureHarmonizer
        options: {reference: under}
  white:
    type: StopSignPatchAttack
    options:
      initial_patch: white
      harmonizer: *exposure_harmonizer
  black:
    type: StopSignPatchAttack
    options:
      initial_patch: black
      harmonizer: *exposure_harmonizer
  noise:
    type: StopSignPatchAttack
    options:
      initial_patch: gaussian_noise
      harmonizer: *exposure_harmonizer
  white_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: white
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          detector:
            type: avsectester.implemented_attacks.stop_sign_patch_attack.detector:StopSignDetector
            options:
              weights_path: ../models/fasterrcnn_resnet50_fpn_coco-258fb6c6.pth
              device: cuda:0
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 20
              step_size: 0.01568627450980392
              batch: 1
              seed: 0
          max_training_segments: null
          samples_per_scene: 8
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/white_detector_pgd
  black_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: black
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          detector:
            type: avsectester.implemented_attacks.stop_sign_patch_attack.detector:StopSignDetector
            options:
              weights_path: ../models/fasterrcnn_resnet50_fpn_coco-258fb6c6.pth
              device: cuda:0
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 20
              step_size: 0.01568627450980392
              batch: 1
              seed: 0
          max_training_segments: null
          samples_per_scene: 8
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/black_detector_pgd
  noise_detector_pgd:
    type: StopSignPatchAttack
    options:
      initial_patch: gaussian_noise
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:DetectorPatchOptimization
        options:
          detector:
            type: avsectester.implemented_attacks.stop_sign_patch_attack.detector:StopSignDetector
            options:
              weights_path: ../models/fasterrcnn_resnet50_fpn_coco-258fb6c6.pth
              device: cuda:0
          optimizer:
            type: avsectester.attack.optimization:PGD
            options:
              steps: 20
              step_size: 0.01568627450980392
              batch: 1
              seed: 0
          max_training_segments: null
          samples_per_scene: 8
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/noise_detector_pgd
  white_rollout_nes:
    type: StopSignPatchAttack
    options:
      initial_patch: white
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:RolloutPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:NES
            options:
              steps: 1
              population_size: 4
              sigma: 0.08
              learning_rate: 0.03
              seed: 0
          start_distances_m:
          - 40
          - 30
          - 20
          horizon_s: 3
          max_training_segments: 1
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/white_rollout_nes
  black_rollout_nes:
    type: StopSignPatchAttack
    options:
      initial_patch: black
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:RolloutPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:NES
            options:
              steps: 1
              population_size: 4
              sigma: 0.08
              learning_rate: 0.03
              seed: 0
          start_distances_m:
          - 40
          - 30
          - 20
          horizon_s: 3
          max_training_segments: 1
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/black_rollout_nes
  noise_rollout_nes:
    type: StopSignPatchAttack
    options:
      initial_patch: gaussian_noise
      harmonizer: *exposure_harmonizer
      optimization:
        type: avsectester.implemented_attacks.stop_sign_patch_attack.offline:RolloutPatchOptimization
        options:
          optimizer:
            type: avsectester.attack.optimization:NES
            options:
              steps: 1
              population_size: 4
              sigma: 0.08
              learning_rate: 0.03
              seed: 0
          start_distances_m:
          - 40
          - 30
          - 20
          horizon_s: 3
          max_training_segments: 1
          output_directory: ../results/nurec_stop_sign_patch_2604/optimization/noise_rollout_nes
evaluation:
  metrics:
  - type: StopLineMetrics
  - type: ReasoningPhraseRate
    options:
      phrase: stop sign
  - type: DrivingMetrics
split:
  train_segments: 4
  seed: 0
  execute: [test]
runs:
  treatments:
  - name: clean
  - name: replica
    attack_name: replica
  - name: white
    attack_name: white
  - name: black
    attack_name: black
  - name: noise
    attack_name: noise
  - name: white_detector_pgd
    attack_name: white_detector_pgd
  - name: black_detector_pgd
    attack_name: black_detector_pgd
  - name: noise_detector_pgd
    attack_name: noise_detector_pgd
  - name: white_rollout_nes
    attack_name: white_rollout_nes
  - name: black_rollout_nes
    attack_name: black_rollout_nes
  - name: noise_rollout_nes
    attack_name: noise_rollout_nes
  seeds:
  - 0
  decision_steps: null
  recording:
    sensor_ids:
    - camera_front_wide_120fov
    representations:
    - model_input
    every_n_steps: 10
  output: ../results/nurec_stop_sign_patch_2604
