# Paths are relative to this file. Set data and model paths for your machine.
device: cuda:0
dataset:
  type: NuRecDataset
  options:
    dataroot: ../data/nurec/26.04_release
    camera_id: camera_front_wide_120fov
    time_step: 0.1
simulator:
  type: NuRecSimulator
  options:
    depth: none
    object_insertion: scene
    ground_mesh: mesh_ground
    physics_update_mode: ego_only
    route_generator: map
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50052
        cameras: [camera_front_wide_120fov]
        lidar: lidar_gt_top_p128
        asset_directory: ../results/nre-assets
    dynamics:
      type: avsectester.closed_loop.simulators.ego_dynamics:AlpaSimController
avstack:
  type: RuleBasedAVStack
  bindings:
    type: avsectester.closed_loop.avstacks.implemented.modules:rule_based_driving_adapter
  options:
    detector:
      type: avsectester.closed_loop.avstacks.implemented.modules:YOLOXDetector
      options:
        weights_path: ../models/yolox_m.pth
attacks:
  vehicle:
    type: VehicleInsertionAttack
    options:
      asset:
        type: avsectester.rendering:load_mesh_asset
        options:
          path: ../avsectester/implemented_attacks/vehicle_insertion_attack/models/real_car_painted.ply
          category: vehicle
          scale: 1.0
          up_axis: "+z"
          forward_axis: "+x"
          origin: file
      harmonizer:
        type: avsectester.rendering.harmonizers:ExposureHarmonizer
        options: {reference: ring}
      distance_m: 25.0
      lateral_offset_m: 0.0
      decision_steps: 20
      max_segments: 1
evaluation:
  metrics:
  - type: DrivingMetrics
  - type: TrajectoryDeviation
runs:
  treatments:
  - name: clean
  - name: vehicle_insertion
    attack_name: vehicle
  seeds: [0]
  recording:
    sensor_ids: [camera_front_wide_120fov, lidar_gt_top_p128]
    representations: [raw, model_input]
    every_n_steps: 1
  output: ../results/nurec_vehicle_insertion_modular_2604
