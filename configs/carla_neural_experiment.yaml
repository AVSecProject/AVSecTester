# Closed-loop CARLA with REAL neural perception (needs a CARLA 0.9.15 server on :2000 and the
# carla-vehicle weights: ./scripts/fetch_models.sh).  avsectester run configs/carla_neural_experiment.yaml
# The ego perceives NPCs via CARLA-trained PointPillars on a real CarlaLidar; a detection-level
# phantom (perception_out seam) forces an unsafe stop.
name: phantom_detection_brake_carla_neural

environment:
  type: CarlaEnv
  perception: neural            # sets up a real CarlaLidar
  n_npcs: 8
  frames: 60

system:
  type: CarlaSystem
  perception: neural            # CarlaLidar cloud -> MMDetObjectDetector3D
  nn_dataset: carla-vehicle     # CARLA-trained weights (fetch_models.sh)
  nn_threshold: 0.3
  target_speed: 6.0
  brake_distance: 8.0

attack:
  type: PhantomDetectionAttack
  target_xyz: [6.0, 0.0, -1.5]  # 6 m ahead (inside the brake corridor), ego/sensor frame
  score: 0.9

metric: {type: ImpactMetric}
