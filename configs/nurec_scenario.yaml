# NuRec/Alpamayo single drive through the configured experiment entry point.
# Run in the AlpaSim driver environment (docs/SETUP.md).
# Set AVSECTESTER_ALPAMAYO_CHECKPOINT or stack.options.checkpoint_path.
# For real rendering, change renderer.type to nurec and configure endpoint/scene_id.
mode: single
treatment: clean
frames: 8
dt: 0.1

backend:
  type: NuRecBackend
  renderer:
    type: stub
    cameras: [camera_front_wide_120fov]
  dynamics:
    type: trajectory
  ego0: {x: 0.0, y: 0.0, yaw: 0.0, speed: 5.0}

stack:
  type: AlpamayoAVStack
  options:
    device: cuda:1
    camera_ids: [camera_front_wide_120fov]

interventions: []
