# Paths are relative to this file; set data/model paths for your machine.
# Alpamayo derives speed from pose history; this example logs the ego_speed field change.
device: cuda:0

dataset:
  type: NuRecDataset
  options:
    usdz_paths:
    - ../data/nurec/023b7fcc-671c-40e3-9bd2-c66b0b073fbc/023b7fcc-671c-40e3-9bd2-c66b0b073fbc.usdz
    camera_id: camera_front_wide_120fov
    time_step: 0.1
simulator:
  type: NuRecSimulator
  options:
    route_generator: map
    physics_update_mode: ego_only
    ground_mesh: mesh
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50051
        cameras:
        - camera_front_wide_120fov
        - camera_front_tele_30fov
        - camera_cross_left_120fov
        - camera_cross_right_120fov
    dynamics:
      type: avsectester.closed_loop.simulators.ego_dynamics:AlpaSimController
avstack:
  type: AlpamayoAVStack
  options:
    checkpoint_path: ../models/Alpamayo-1.5-10B
    camera_ids:
    - camera_front_wide_120fov
    - camera_front_tele_30fov
    - camera_cross_left_120fov
    - camera_cross_right_120fov
    output_frequency_hz: 10
    frame_subsample: 1
attacks:
  speed:
    type: SpeedFeedbackAttack
    options:
      decision_steps: 20
      max_segments: 2
      target_speed: 12.0
      gain: 0.1
      max_bias: 5.0
runs:
  treatments:
  - name: clean
  - name: speed
    attack_name: speed
  seeds:
  - 0
  recording:
    sensor_ids:
    - camera_front_wide_120fov
    representations:
    - model_input
    every_n_steps: 1
  output: ../results/nurec_speed_feedback
