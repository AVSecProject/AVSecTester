# Run with: avsectester run configs/nurec_speed_feedback.yaml
# Paths are relative to this file; set data/model paths for your machine.
dataset:
  type: NuRecDataset
  options:
    usdz_paths:
    - ../data/nurec/023b7fcc-671c-40e3-9bd2-c66b0b073fbc/023b7fcc-671c-40e3-9bd2-c66b0b073fbc.usdz
    camera_id: camera_front_wide_120fov
    camera_alias: camera_front_wide_120fov
    time_step: 0.1
simulator:
  type: NuRecSimulator
  options:
    config:
      dt: 0.1
    renderer:
      type: avsectester.closed_loop.simulators.nurec:NuRecRenderer
      options:
        endpoint: 127.0.0.1:50051
        cameras:
        - camera_front_wide_120fov
    dynamics:
      type: avsectester.closed_loop.simulators.nurec:TrajectoryFollower
      options: {}
avstack:
  type: AlpamayoAVStack
  options:
    checkpoint_path: ../models/Alpamayo-1.5-10B
    camera_ids:
    - camera_front_wide_120fov
    device: cuda:1
    output_frequency_hz: 10
attacks:
  speed:
    type: SpeedFeedbackAttack
    options:
      decision_steps: 20
      max_segments: 2
      target_speed: 12.0
      gain: 0.1
      max_bias: 5.0
runs:
  treatments:
  - name: clean
  - name: speed
    attack_name: speed
  seeds:
  - 0
  recording:
    sensor_ids:
    - camera_front_wide_120fov
    representations:
    - model_input
    every_n_steps: 1
  output: ../results/nurec_speed_feedback
