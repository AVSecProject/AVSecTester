name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The avsecproject.github.io repository publishes the site from main; this workflow only checks
# that main and pull requests still build.
jobs:
  build:
    name: Build site
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install site dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Build site
        run: mkdocs build --strict -f website/mkdocs.yml

      - name: Check built site
        run: python -m scripts.website.check_site website/site
