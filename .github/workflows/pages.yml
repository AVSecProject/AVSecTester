name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never interrupt a deployment from main; superseded pull-request builds may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install site dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Build site
        run: mkdocs build --strict -f website/mkdocs.yml

      - name: Check built site
        run: python -m scripts.website.check_site website/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/site

  deploy:
    name: Deploy site
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
